[Paths]
ProjectRoot = D:\WORK\Sueneé Universe\EDITING\

[DaVinciResolve]
# Optional Project Library folder. Leave empty to create projects at the library root.
ResolveProjectFolder = Sueneé Universe

# Resolve executable. Leave empty to use the standard installation path.
ResolveExe =

# Maximum safety timeout for one Resolve startup attempt.
StartupTimeout = 180

# How long --alive keeps an idle headless Resolve running, in seconds.
AliveTimeout = 900

[Deliver]
# Render preset loaded into the project's Deliver settings. Leave empty to disable.
Preset = Castr.io

# Folder created inside the production project directory and used as Deliver TargetDir.
Folder = DELIVERY

[Timeline]
# Voice Isolation amount applied to all source audio tracks on the first newly-created timeline.
VoiceIsolationAmount = 100

# Create one additional empty audio track without Voice Isolation.
CreateCleanAudioTrack = true

# Optional name for the additional clean audio track.
CleanAudioTrackName = AUDIO

[IntroDetection]
# Folder containing reference intro/jingle media files.
Folder = D:\WORK\INTRO

# Search only within this many seconds from the beginning of the timeline material.
SearchWindowSeconds = 120

# Minimum normalized fingerprint correlation required before any edit is made.
MinConfidence = 0.78

# Audio analysis parameters. Lower sample rate keeps matching fast; video is never decoded.
SampleRate = 8000
EnvelopeHopMs = 20

[Logging]
# off = no log, single = latest run only, all = complete history
Mode = single
