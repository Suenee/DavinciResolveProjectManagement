[General]
# auto = Windows UI language; unsupported or undetectable languages fall back to English.
Language = auto

[Paths]
# Keys are arbitrary unique labels. Paths are checked in this order; the first existing path is used.
LovePeace = D:\WORK\Sueneé Universe\EDITING\
Spirit = N:\WORK\Sueneé Universe\EDITING\

[DaVinciResolve]
# Optional Project Library folder. Leave empty to create projects at the library root.
ResolveProjectFolder = Sueneé Universe

# Resolve executable. Leave empty to use the standard installation path.
ResolveExe =

# Maximum safety timeout for one Resolve startup attempt.
StartupTimeout = 180

# How long --alive keeps an idle headless Resolve running, in seconds.
AliveTimeout = 900

[Deliver]
# Render preset loaded into the project's Deliver settings. Leave empty to disable.
Preset = Castr.io

# Folder created inside the production project directory and used as Deliver TargetDir.
Folder = DELIVERY

[Timeline]
# Voice Isolation amount applied to all source audio tracks on the first newly-created timeline.
VoiceIsolationAmount = 100

# Create one additional empty audio track without Voice Isolation.
CreateCleanAudioTrack = true

# Optional name for the additional clean audio track.
CleanAudioTrackName = AUDIO

[TimelineAssets]
# %Y is replaced by the year being searched.
TitlesRoot = O:\Sueneé Universe\YouTube Channel\Titles\%Y
TitleDurationSeconds = 20
EndCreditsFile = Credits\endcredits.jpg
EndCreditsDurationSeconds = 25
YearBoundaryToleranceDays = 14
TitleCandidateCount = 5
# Minimum similarity for an automatic title-image choice. Ambiguous matches are shown to the user.
TitleAutoMatchScore = 0.88

[IntroDetection]
# Folder containing reference intro/jingle media files.
Folder = D:\WORK\INTRO

# Search only within this many seconds from the beginning of the timeline material.
SearchWindowSeconds = 120

# Minimum normalized fingerprint correlation required before any edit is made.
MinConfidence = 0.78

# Audio analysis parameters. Lower sample rate keeps matching fast; video is never decoded.
SampleRate = 8000
EnvelopeHopMs = 20

[SilenceTrim]
# Master switch for the optional edge-silence workflow on new Resolve projects.
Enabled = true
# Analyze only this many seconds from each edge of every SHOOTING clip.
SearchSeconds = 30
# Audio below this level is considered silence.
ThresholdDb = -40
# Ignore clicks/short noises unless sound remains above threshold for this long.
MinimumSoundSeconds = 0.20
# Natural pause retained around detected speech.
KeepBeforeSeconds = 0.75
KeepAfterSeconds = 1.00

[IntroMapping]
# Regular expressions are matched against the project name, case-insensitively, in this order.
# The key is the intro filename from IntroDetection.Folder; the value is the regular expression.
UFO Disclosure.mp4 = ^.*Zprávy\s+z\s+Exopolitiky.*$
Spirituality.mp4 = ^.*spirit.*$
Exopolitics.mp4 = ^.*(?:UFO|exopolit).*$

[Logging]
# off = no log, single = latest run only, all = complete history
Mode = single
